<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #07182b;
    color: #eaf1f9;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
  }
  .logo {
    font-size: 13px;
    letter-spacing: 4px;
    color: #FF7F00;
    font-weight: 600;
  }
  .title { font-size: 22px; font-weight: 300; color: #eaf1f9; }
  .bar-outer {
    width: 220px; height: 3px;
    background: #1d3a5c; border-radius: 2px; overflow: hidden;
  }
  .bar-inner {
    height: 100%; width: 0%;
    background: #FF7F00; border-radius: 2px;
    animation: load 8s ease-out forwards;
  }
  @keyframes load { 0%{width:0%} 60%{width:75%} 90%{width:90%} 100%{width:95%} }
  .status {
    font-size: 12px; color: #7a8ca3; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="logo">INTEKS DISPLAY</div>
  <div class="title">Iniciando...</div>
  <div class="bar-outer"><div class="bar-inner"></div></div>
  <div class="status" id="status">Cargando servidor...</div>
  <script>
    const msgs = [
      "Cargando servidor...",
      "Verificando puerto...",
      "Iniciando módulos...",
      "Preparando admin..."
    ];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % msgs.length;
      document.getElementById('status').textContent = msgs[i];
    }, 1800);
  </script>
</body>
</html>
