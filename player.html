<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>InTeks Display Player</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="alternate icon" href="/assets/icon-32.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;cursor:none;font-family:sans-serif}
#player{width:100vw;height:100vh;position:fixed;top:0;left:0;transform-origin:top left;background:#000;overflow:hidden}

/* ── Slides normales */
.slide{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;background:#000;
  transition:opacity var(--trans-ms,1000ms) ease-in-out, transform var(--trans-ms,1000ms) ease-in-out}
.slide.active{opacity:1}

/* ── Transiciones. Solo opacity y transform: son las unicas que la GPU compone
   sin repintar, y en un Android TV barato lo demas da tirones.
   Las diapositivas viven DENTRO de #player, que es quien lleva la rotacion, asi
   que translateX se ve horizontal aunque la tele este en vertical: el eje X del
   contenido es lo que el espectador percibe como horizontal. */
.slide.sin-transicion{transition:none}

#player.tr-none .slide{transition:none}

#player.tr-zoom .slide{transform:scale(1.06)}
#player.tr-zoom .slide.active{transform:scale(1)}
#player.tr-zoom .slide.leaving{transform:scale(.96)}

/* Hace falta .leaving para distinguir "la que se va" de "las que esperan": sin
   eso las dos irian al mismo lado y se cruzarian al reves. */
#player.tr-slide .slide{transform:translateX(100%)}
#player.tr-slide .slide.active{transform:translateX(0)}
#player.tr-slide .slide.leaving{transform:translateX(-100%);opacity:1}
.slide img{width:100%;height:100%;object-fit:contain}
.slide video{width:100%;height:100%;object-fit:contain;background:#000}
.slide iframe{width:100%;height:100%;border:none;background:#fff}
.slide.wall-left img,.slide.wall-left video{object-fit:cover;object-position:left center}
.slide.wall-right img,.slide.wall-right video{object-fit:cover;object-position:right center}

/* ── Texto */
.text-slide{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8vw;text-align:center}
.text-slide h2{font-size:clamp(28px,6vw,96px);font-weight:700;line-height:1.1;margin-bottom:.3em}
.text-slide p{font-size:clamp(16px,3vw,48px);opacity:.75;line-height:1.5}

/* ── Módulo divisas */
.mod-fx{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
/* Porcentajes y no vw, por lo mismo que en las filas: con el player rotado por
   CSS, vw se refiere al viewport sin rotar y todo sale desproporcionado. El
   título se recorta antes que partir en tres líneas y montarse sobre el logo. */
.mod-fx-header{padding:3vh 4% 2vh;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:3%;--fx-title-size:clamp(16px,3.4vmin,40px)}
.mod-fx-title{font-size:var(--fx-title-size);font-weight:700;letter-spacing:2px;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15}
.mod-fx-date{font-size:clamp(11px,1.7vmin,20px);opacity:.4;font-family:monospace;letter-spacing:1px;white-space:nowrap}
/* Tasas pasadas de plazo. Parpadeo lento y discreto: lo ve el personal al
   pasar, pero no monta un cartel delante del cliente. */
.mod-fx-date.caducada{opacity:.85;animation:fxCaducada 2.4s ease-in-out infinite}
@keyframes fxCaducada{0%,100%{opacity:.85}50%{opacity:.3}}
.mod-fx-page{font-size:clamp(11px,1.7vmin,20px);opacity:.55;font-family:monospace;letter-spacing:1px;padding:2px 10px;border:1px solid rgba(255,255,255,.2);border-radius:99px;white-space:nowrap}
.mod-fx-logo{height:var(--fx-title-size);max-width:26%;object-fit:contain;flex-shrink:0}
/* Las filas se REPARTEN el alto disponible y la tipografía escala con el alto
   que le toca a cada una (--fx-row-h, que fija el JS).
   Los topes van contra --fx-box-w, el ancho REAL de la caja medido por el JS,
   y NO contra vw. Con el player rotado por CSS (transform:rotate(90deg)) la
   caja mide 100vh de ancho, así que vw se refiere al viewport sin rotar: los
   topes salían un 78% más grandes de lo que cabía y el nombre del país se
   solapaba con la cotización. */
.mod-fx-rows{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 4% 3vh;gap:0;--fx-row-h:80px;--fx-box-w:1000px}
.mod-fx-note{flex-shrink:0;max-height:18%;overflow:hidden;padding:1.5vh 4% 2.5vh;border-top:1px solid rgba(255,255,255,.12);font-size:clamp(11px,1.9vmin,22px);line-height:1.35;opacity:.75}
.fx-row{flex:var(--fx-flex,1 1 0);min-height:0;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);gap:2.5%;height:var(--fx-row-h)}
.fx-row:last-child{border-bottom:none}
.fx-flag{font-size:min(calc(var(--fx-row-h)*.42),calc(var(--fx-box-w)*.075));width:min(calc(var(--fx-row-h)*.55),calc(var(--fx-box-w)*.10));text-align:center;flex-shrink:0}
.fx-country{flex:1;min-width:0}
/* El nombre del país no puede empujar a la cotización: si no cabe, se recorta */
.fx-country-name{font-size:min(calc(var(--fx-row-h)*.26),calc(var(--fx-box-w)*.055));font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-currency{font-size:min(calc(var(--fx-row-h)*.13),calc(var(--fx-box-w)*.028));opacity:.45;font-family:monospace;letter-spacing:1px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-rate{text-align:right;flex-shrink:0;min-width:0}
.fx-rate-val{font-size:min(calc(var(--fx-row-h)*.42),calc(var(--fx-box-w)*.115));font-weight:700;font-family:monospace;letter-spacing:-1px;white-space:nowrap}
.fx-rate-label{font-size:min(calc(var(--fx-row-h)*.10),calc(var(--fx-box-w)*.022));opacity:.4;text-align:right;letter-spacing:1px;margin-top:2px;white-space:nowrap}

/* ── Módulo clima */
.mod-weather{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vw;text-align:center}
.weather-city{font-size:clamp(18px,3vw,40px);font-weight:500;opacity:.5;letter-spacing:3px;text-transform:uppercase;margin-bottom:1vh}
.weather-icon{font-size:clamp(80px,18vw,200px);line-height:1;margin:2vh 0}
.weather-temp{font-size:clamp(64px,14vw,180px);font-weight:700;font-family:monospace;line-height:1}
.weather-unit{font-size:clamp(28px,5vw,64px);opacity:.4;vertical-align:super}
.weather-desc{font-size:clamp(16px,2.5vw,36px);opacity:.55;margin-top:1.5vh;letter-spacing:2px}
.weather-details{display:flex;gap:4vw;margin-top:3vh;opacity:.4;font-size:clamp(12px,1.8vw,22px);font-family:monospace}

/* ── Módulo noticias ticker */
.mod-ticker{width:100%;height:100%;display:flex;flex-direction:column}
.ticker-header{padding:3vh 4vw 2vh;flex-shrink:0}
.ticker-title{font-size:clamp(14px,2vw,28px);font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.5}
.ticker-items{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 4vw}
.ticker-item{padding:clamp(12px,2.5vh,32px) 0;border-bottom:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
.ticker-item.visible{opacity:1;transform:translateY(0)}
.ticker-item-source{font-size:clamp(10px,1.2vw,16px);opacity:.35;letter-spacing:2px;text-transform:uppercase;font-family:monospace;margin-bottom:.4em}
.ticker-item-text{font-size:clamp(16px,2.8vw,40px);font-weight:500;line-height:1.35}

/* ── Pantalla de espera */
#offline-dot{position:absolute;right:10px;bottom:10px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);z-index:60;pointer-events:none}
#waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:#000}
#waiting .sid{font-size:clamp(48px,12vw,120px);font-weight:700;color:#fff;letter-spacing:4px;font-family:monospace}
#waiting .slabel{font-size:clamp(12px,2vw,20px);color:rgba(255,255,255,.25);letter-spacing:6px;text-transform:uppercase;font-family:monospace}
#waiting .shint{font-size:clamp(10px,1.4vw,15px);color:rgba(255,255,255,.14);letter-spacing:2px;font-family:monospace;margin-top:6px}

/* ── Progress bar */
#pbar{position:absolute;bottom:0;left:0;width:0;height:3px;background:rgba(255,255,255,.45);transition:width linear;z-index:100}

/* ── Módulo QR */
.mod-qr{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vw}
.qr-code-container{margin-bottom:4vh}
.qr-text{font-size:clamp(16px,2.5vw,32px);margin-top:4vh;text-align:center}

/* ── Ficha de producto */
.mod-product{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:center;padding:6vw}
.product-image{width:100%;aspect-ratio:1;object-fit:contain;border-radius:2vw}
.product-info{display:flex;flex-direction:column;justify-content:center}
.product-name{font-size:clamp(32px,5vw,64px);font-weight:700;margin-bottom:1vh;line-height:1.1}
.product-price{font-size:clamp(28px,4vw,52px);font-weight:700;margin-bottom:2vh}
.product-old-price{text-decoration:line-through;opacity:.5;font-size:clamp(16px,2.5vw,28px);margin-bottom:1vh}
.product-specs{font-size:clamp(14px,2vw,24px);line-height:1.8;opacity:.8}
.product-badge{display:inline-block;padding:.5em 1em;background:rgba(255,255,255,.2);border-radius:1vw;font-size:clamp(12px,1.5vw,18px);margin-bottom:2vh;font-weight:600}

/* ── Comparativa */
.mod-comparison{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:4vw;padding:4vw;align-items:center}
.comparison-product{display:flex;flex-direction:column;align-items:center;text-align:center}
.comparison-image{width:90%;aspect-ratio:1;object-fit:contain;margin-bottom:2vh;border-radius:1vw}
.comparison-name{font-size:clamp(24px,3.5vw,44px);font-weight:700;margin-bottom:1vh}
.comparison-price{font-size:clamp(20px,3vw,40px);font-weight:700;color:#4ff0c0;margin-bottom:2vh}
.comparison-features{text-align:left;font-size:clamp(12px,1.8vw,22px);line-height:1.7;opacity:.8}
.comparison-badge{position:absolute;top:2vw;right:2vw;background:#ff7040;padding:.5em 1.2em;border-radius:1vw;font-weight:700;font-size:clamp(12px,1.5vw,18px)}

/* ── Cuenta atrás */
.mod-countdown{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vw;text-align:center}
.countdown-message{font-size:clamp(20px,3vw,40px);margin-bottom:3vh;opacity:.8}
.countdown-timer{font-size:clamp(72px,16vw,200px);font-weight:700;font-family:monospace;letter-spacing:-2px}
.countdown-unit{font-size:clamp(14px,2vw,28px);opacity:.5;margin-left:1vw;display:inline-block;vertical-align:top}
.countdown-end{font-size:clamp(18px,2.5vw,36px);margin-top:3vh;opacity:.8}

/* ── Rotación de pantalla según instalación física (0/90/180/270) */
body.rot-90 #player{ width:100vh;height:100vw; transform:rotate(90deg) translateY(-100%); }
body.rot-180 #player{ transform:rotate(180deg) translate(-100%,-100%); }
body.rot-270 #player{ width:100vh;height:100vw; transform:rotate(270deg) translateX(-100%); }
</style>
</head>
<body>
<div id="player">
  <div id="waiting">
    <div class="slabel">pantalla conectada</div>
    <div class="sid" id="sid-display"></div>
    <div class="shint" id="url-hint"></div>
  </div>
  <div id="pbar"></div>
</div>
<script>
// Caché offline (solo en localhost/HTTPS; en http://IP el navegador lo ignora silenciosamente)
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }

// ── Identidad de la pantalla ───────────────────────────────────────────────
// BLOQUE COMPARTIDO: copia literal en index.html, pair.html y player.html.
// Va repetido a propósito y no en un .js aparte: un <script src> obliga a
// hablar con el servidor antes de poder decidir a dónde ir, y con el servidor
// caído el televisor se quedaría en blanco. Cada página decide sola.
//
// Dos almacenes porque hay navegadores de TV que limpian uno al apagarse pero
// no el otro. Solo son más robustos si se olvidan A LA VEZ: si olvidar dejara
// la cookie puesta, una pantalla borrada rebotaría entre /pair y el player sin
// parar. tests/identidad.test.js vigila las dos cosas.
var IDENT_KEY = "signalos_screen_id";
var IDENT_COOKIE = "signalos_screen";
function leerIdentidad(){
  try{ var v = localStorage.getItem(IDENT_KEY); if(v) return v; }catch(e){}
  try{
    var m = document.cookie.match(/(?:^|;\s*)signalos_screen=([^;]*)/);
    if(m && m[1]) return decodeURIComponent(m[1]);
  }catch(e){}
  return null;
}
function guardarIdentidad(sid){
  if(!sid) return;
  try{ localStorage.setItem(IDENT_KEY, sid); }catch(e){}
  try{ document.cookie = IDENT_COOKIE + "=" + encodeURIComponent(sid) +
       ";path=/;max-age=31536000;samesite=lax"; }catch(e){}
}
function olvidarIdentidad(){
  try{ localStorage.removeItem(IDENT_KEY); }catch(e){}
  try{ document.cookie = IDENT_COOKIE + "=;path=/;max-age=0;samesite=lax"; }catch(e){}
}
// ── fin del bloque compartido ──────────────────────────────────────────────

const params=new URLSearchParams(location.search);
// Modo vista previa: el admin incrusta el player en un iframe. No debe
// conectarse por SSE, ni registrarse como pantalla, ni aplicar el horario, o
// ensuciaría screens.json marcando pantallas como conectadas.
const PREVIEW=params.get("preview")==="1";
// Identidad de la pantalla: URL (?screen=) → memoria del dispositivo → si no hay, emparejar.
// La URL manda sobre la memoria a propósito: es el remedio para los televisores
// que borran todo al apagarse. Se pega el enlace directo como página de inicio
// y la identidad viaja donde ningún borrado la alcanza.
const _sidParam=params.get("screen");
const SCREEN_ID=_sidParam||leerIdentidad();
if(!SCREEN_ID && !PREVIEW){ location.replace("/pair"); }   // en previa no hay ?screen=
else if(_sidParam){ guardarIdentidad(_sidParam); }         // recordar por dispositivo
// Rotación forzada por URL: ?rotation=0/90/180/270 (o ?vertical=1 → 90, retrocompat)
const URL_ROTATION = params.get("rotation")!==null ? parseInt(params.get("rotation"))
                   : (params.get("vertical")==="1" ? 90 : null);

// Aplica la orientación física de la pantalla (0/90/180/270)
function applyRotation(deg){
  deg=(((parseInt(deg)||0)%360)+360)%360;
  document.body.classList.remove("rot-90","rot-180","rot-270");
  if(deg===90) document.body.classList.add("rot-90");
  else if(deg===180) document.body.classList.add("rot-180");
  else if(deg===270) document.body.classList.add("rot-270");
}

if(SCREEN_ID){
  document.getElementById("sid-display").textContent=SCREEN_ID;
  document.getElementById("url-hint").textContent=location.host+"/player.html?screen="+SCREEN_ID;
}
if(PREVIEW) document.getElementById("waiting").style.display="none";
if(URL_ROTATION!==null) applyRotation(URL_ROTATION);

let playlist=[],current=0,timer=null,screenSchedule=null,screenConfig=null;

// ── Orden de reproduccion ──────────────────────────────────────────────────
// Una pantalla de tienda repite el mismo ciclo todo el día. Con pocos
// contenidos, el orden fijo hace que el cliente que espera su turno vea
// exactamente la misma secuencia tres veces seguidas.
//
// Lo delicado no es barajar —eso es Fisher-Yates— sino el empalme entre una
// vuelta y la siguiente: si la última de una vuelta abre la siguiente, el mismo
// cartel sale dos veces seguidas y parece que la pantalla se ha colgado. De ahí
// el parámetro `ultimo`.
function ordenReproduccion(n, aleatorio, ultimo){
  var o = [];
  for(var i = 0; i < n; i++) o.push(i);
  if(!aleatorio || n < 2) return o;
  for(var j = o.length - 1; j > 0; j--){          // Fisher-Yates
    var k = Math.floor(Math.random() * (j + 1));
    var t = o[j]; o[j] = o[k]; o[k] = t;
  }
  // Con un solo contenido repetir es inevitable; con dos o más, se aparta.
  if(ultimo >= 0 && o[0] === ultimo){
    var t2 = o[0]; o[0] = o[1]; o[1] = t2;
  }
  return o;
}
// ── fin del orden ──────────────────────────────────────────────────────────

// ── Transiciones entre diapositivas ────────────────────────────────────────
// Ya había un fundido de 1 s metido en el CSS de .slide, pero no se podía
// elegir ni ajustar. Ahora el tipo y la duración van por pantalla: un
// escaparate y una pantalla de caja piden ritmos distintos.
//
// Solo se animan opacity y transform. Son las dos únicas propiedades que la GPU
// compone sin repintar; cualquier otra cosa da tirones en un Android TV barato,
// que es el hardware donde esto acaba corriendo.
var TRANS_TIPOS = {fade:"tr-fade", slide:"tr-slide", zoom:"tr-zoom", none:"tr-none"};
var TRANS_MS_DEFECTO = 1000;
var TRANS_MS_MAX = 2000;      // por encima, la pantalla vive en transición

function claseTransicion(cfg){
  var t = (cfg||{}).transition;
  // Un tipo desconocido —de una copia de otra versión, o de un JSON tocado a
  // mano— cae al fundido. Nunca puede dejar una pantalla que no se ve.
  return TRANS_TIPOS[t] || TRANS_TIPOS.fade;
}

function duracionTransicion(cfg){
  cfg = cfg || {};
  if(cfg.transition === "none") return 0;
  var ms = cfg.transition_ms;
  if(ms === undefined || ms === null || ms === "") return TRANS_MS_DEFECTO;
  ms = parseFloat(ms);
  if(isNaN(ms)) return TRANS_MS_DEFECTO;
  return Math.max(0, Math.min(TRANS_MS_MAX, ms));
}
// ── fin de las transiciones ────────────────────────────────────────────────

// Lleva el tipo y la duración al DOM. Va aparte del núcleo puro de arriba
// porque toca el documento y eso no se puede probar en Node.
function aplicarTransicion(cfg){
  const p=document.getElementById("player");
  if(!p) return;
  p.classList.remove("tr-fade","tr-slide","tr-zoom","tr-none");
  p.classList.add(claseTransicion(cfg));
  p.style.setProperty("--trans-ms", duracionTransicion(cfg)+"ms");
}

// ── Medios guardados en el televisor ───────────────────────────────────────
// El texto, las divisas, el clima y el ticker ya aguantan sin servidor, pero
// las imágenes y los vídeos dependían de la caché del navegador: si el PC del
// servidor está apagado y el televisor arranca en frío, el escaparate se queda
// vacío.
//
// La solución de manual (service worker) exige HTTPS, y montar un túnel en cada
// tienda es una dependencia externa que no compensa. IndexedDB funciona en la
// red local tal cual, sobre http y sin depender de nadie.
//
// Este trozo es el núcleo, y es puro a propósito: decide QUÉ se guarda, QUÉ URL
// se pinta y QUÉ se suelta. Todo lo que toca IndexedDB va aparte, más abajo,
// porque eso no se puede probar en Node.
function esMedioCacheable(item){
  if(!item) return false;
  if(item.type!=="image" && item.type!=="video") return false;
  // Solo lo que sirve nuestro propio servidor. Una imagen remota puede ser
  // enorme, cambiar sola o no dejarse descargar por CORS.
  return String(item.src||"").indexOf("/uploads/")===0;
}

function mediosDePlaylist(pl){
  var out=[], vistos={};
  (pl||[]).forEach(function(it){
    if(esMedioCacheable(it) && !vistos[it.src]){ vistos[it.src]=1; out.push(it.src); }
  });
  return out;
}

function urlDeMedio(src, mapa){
  // Nunca se deja de pintar por no tener copia: la red es el respaldo.
  return (mapa && mapa[src]) ? mapa[src] : src;
}

function sobrantes(mapa, usados){
  // Un player de señalización está semanas encendido. Sin soltar las URL de
  // objeto, cada cambio de playlist deja memoria retenida para siempre.
  var fuera=[], enUso={};
  (usados||[]).forEach(function(s){ enUso[s]=1; });
  Object.keys(mapa||{}).forEach(function(s){ if(!enUso[s]) fuera.push(s); });
  return fuera;
}
// ── fin del nucleo de medios ───────────────────────────────────────────────

// Pegamento con IndexedDB. NO está cubierto por tests: en Node no hay
// IndexedDB. Por eso todo lo que decide algo vive arriba, en el núcleo puro, y
// aquí solo queda guardar, leer y soltar.
//
// Ninguna de estas funciones lanza: si el televisor no tiene IndexedDB, o se
// queda sin espacio, o falla la descarga, se sigue tirando de red. Perder la
// caché es una molestia; que el escaparate se quede en negro, no.
const MEDIOS_DB="inteks_medios", MEDIOS_STORE="archivos";
let mediosLocales={};              // src -> blob: URL

function abrirDB(){
  return new Promise(function(res){
    try{
      const req=indexedDB.open(MEDIOS_DB,1);
      req.onupgradeneeded=function(){
        const db=req.result;
        if(!db.objectStoreNames.contains(MEDIOS_STORE)) db.createObjectStore(MEDIOS_STORE);
      };
      req.onsuccess=function(){ res(req.result); };
      req.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}

function idbLeer(db,clave){
  return new Promise(function(res){
    try{
      const p=db.transaction(MEDIOS_STORE,"readonly").objectStore(MEDIOS_STORE).get(clave);
      p.onsuccess=function(){ res(p.result||null); };
      p.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}

function idbGuardar(db,clave,blob){
  return new Promise(function(res){
    try{
      const p=db.transaction(MEDIOS_STORE,"readwrite").objectStore(MEDIOS_STORE).put(blob,clave);
      p.onsuccess=function(){ res(true); };
      // Lo normal aquí es quedarse sin cuota: los TV dan poco espacio. No es un
      // error que haya que anunciar, simplemente ese archivo irá por red.
      p.onerror=function(){ res(false); };
    }catch(e){ res(false); }
  });
}

function idbBorrar(db,clave){
  try{ db.transaction(MEDIOS_STORE,"readwrite").objectStore(MEDIOS_STORE).delete(clave); }
  catch(e){}
}

async function sincronizarMedios(){
  if(PREVIEW) return;              // la previa del admin no llena el disco de nadie
  if(typeof indexedDB==="undefined") return;
  const db=await abrirDB();
  if(!db) return;

  const usados=mediosDePlaylist(playlist);

  // Soltar lo que ya no está en la playlist, en memoria y en disco.
  sobrantes(mediosLocales,usados).forEach(function(src){
    try{ URL.revokeObjectURL(mediosLocales[src]); }catch(e){}
    delete mediosLocales[src];
    idbBorrar(db,src);
  });

  let nuevos=0;
  for(const src of usados){
    if(mediosLocales[src]) continue;
    let blob=await idbLeer(db,src);
    if(!blob){
      try{
        const r=await fetch(src,{cache:"no-store"});
        if(!r.ok) continue;
        blob=await r.blob();
        await idbGuardar(db,src,blob);
        nuevos++;
      }catch(e){ continue; }      // sin servidor: ya se cogerá la próxima vez
    }
    try{ mediosLocales[src]=URL.createObjectURL(blob); }catch(e){}
  }
  // Si hemos ganado copias nuevas, que las diapositivas pasen a usarlas sin
  // esperar al siguiente cambio de playlist. Basta con repasar la ventana: las
  // que están lejos ya resolverán su URL cuando les toque entrar. Antes esto
  // rehacía TODAS las diapositivas, que con cincuenta es tirar y reconstruir el
  // DOM entero cada vez que termina una descarga.
  if(nuevos) materializarVentana();
}

// ── Frescura de las tasas ──────────────────────────────────────────────────
// El tablero mostraba SIEMPRE la fecha de hoy, sacada del reloj del navegador.
// Unas tasas de hace tres días salían con la fecha de hoy al lado: el propio
// tablero certificaba que estaban recién puestas, y si un cliente reclama esa
// fecha juega en contra de la casa de cambio.
//
// Ahora se enseña la fecha de LAS TASAS —el sello updated_at, que ya escribía
// el servidor y no leía nadie— y, pasado un plazo, se atenúa para que el
// personal lo note al pasar sin montar un cartel delante del cliente.
var STALE_HORAS_POR_DEFECTO = 24;

function horasDeCaducidad(item){
  var h = (item||{}).stale_hours;
  if(h === undefined || h === null || h === "") return STALE_HORAS_POR_DEFECTO;
  h = parseFloat(h);
  return isNaN(h) ? STALE_HORAS_POR_DEFECTO : h;
}

function tasasCaducadas(item, ahoraMs){
  var horas = horasDeCaducidad(item);
  if(!(horas > 0)) return false;                    // 0 = aviso desactivado
  var ts = parseFloat((item||{}).updated_at);
  if(!ts || isNaN(ts)) return false;                // sin sello no se acusa a nadie
  return (ahoraMs/1000 - ts) > horas*3600;
}

function fechaTasas(item, ahoraMs){
  var ts = parseFloat((item||{}).updated_at);
  var d = (ts && !isNaN(ts)) ? new Date(ts*1000) : new Date(ahoraMs);
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
}
// ── fin de la frescura ─────────────────────────────────────────────────────

// ── Resiliencia sin servidor ───────────────────────────────────────────────
// Una pantalla de señalización no puede quedarse en negro porque el servidor se
// reinicie. Tres reglas: el CONTENIDO nunca fuerza una recarga de la página
// (las actualizaciones llegan por SSE y repintan solo, ver connectSSE), lo
// último reproducido queda guardado en el dispositivo, y un corte solo se
// señala si es prolongado. La recarga de seguridad de más abajo (RELOAD_
// SEGURIDAD_MS) no es una excepción a esto: no la dispara el contenido ni el
// estado del servidor, así que si cae justo en ese instante, restoreFromCache()
// hace el mismo papel que al encender la pantalla.
const OFFLINE_AFTER_MS=120000;                     // 2 min sin contacto = corte
const CACHE_KEY="signalos_cache_"+SCREEN_ID;
let lastContact=Date.now();

function isOffline(desde, ahora){ return (ahora-desde)>OFFLINE_AFTER_MS; }

// Guarda lo que se está reproduciendo, para poder arrancar sin servidor.
function saveCache(){
  if(!playlist.length) return;                     // no pisar la caché con vacío
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({playlist, config:screenConfig, at:Date.now()}));
  }catch(e){}
}

// Recupera lo último reproducido. Devuelve true si había algo que mostrar.
function restoreFromCache(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(e){ return false; }
  if(!d||!Array.isArray(d.playlist)||!d.playlist.length) return false;
  screenConfig=d.config||null;
  screenSchedule=(d.config&&d.config.schedule)||null;   // sin esto se encendería fuera de horario
  playlist=d.playlist;
  aplicarTransicion(screenConfig);   // la caché también recuerda cómo transiciona
  rebuildSlides();
  rehacerOrden();
  showSlide(orden[0]||0);
  // Arranque en frío con el servidor caído: aquí es donde de verdad importa
  // tener las imágenes guardadas en el propio televisor.
  sincronizarMedios();
  return true;
}

function getDayName(){
  const days=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  return days[new Date().getDay()];
}

function fechaHoy(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0");
}

// El horario semanal no sabe de fiestas: el 25 de diciembre cae en un día
// laborable cualquiera y la tienda está cerrada igual. Un festivo es una fecha
// concreta que manda sobre la regla del día de la semana, para cerrar o para
// abrir con horas distintas.
function festivoDeHoy(){
  const lista=(screenSchedule&&screenSchedule.holidays)||[];
  const hoy=fechaHoy();
  for(let i=0;i<lista.length;i++){
    if(lista[i]&&lista[i].date===hoy) return lista[i];
  }
  return null;
}

function isScreenActive(){
  if(PREVIEW) return true;                                       // la previa siempre muestra contenido
  if(screenConfig&&screenConfig.always_on) return true;          // modo 24/7 explícito
  if(!screenSchedule||!Object.keys(screenSchedule).length) return true;  // sin horario = siempre activa
  let dayConfig=festivoDeHoy();
  if(!dayConfig){
    // Si solo hay festivos configurados, el resto del año se sigue como si no
    // hubiera horario. Lo contrario apagaría todas las pantallas los 360 días
    // que no son fiesta, y el modo festivos sería una trampa.
    const dias=Object.keys(screenSchedule).filter(k=>k!=="holidays");
    if(!dias.length) return true;
    dayConfig=screenSchedule[getDayName()];
  }
  if(!dayConfig||!dayConfig.enabled) return false;
  const now=new Date();
  const currentTime=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  // Abierto sin horas = todo el día. Antes, enabled:true sin start/end dejaba
  // la pantalla apagada las 24 horas comparando contra undefined: silencioso y
  // desconcertante.
  const start=dayConfig.start||"00:00";
  const end=dayConfig.end||"23:59";
  // Comparar strings "HH:MM" solo sirve para intervalos del mismo día. Si el
  // horario cruza medianoche (p.ej. 22:00→02:00, típico de bares) start>end y
  // el intervalo es la unión de [start,23:59] y [00:00,end].
  if(start<=end) return currentTime>=start && currentTime<=end;
  return currentTime>=start || currentTime<=end;
}

function showStandby(){

  const standby=document.createElement("div");

}

async function loadPlaylist(){
  try{
    const r=await fetch(`/api/playlist?screen=${encodeURIComponent(SCREEN_ID)}`);
    const d=await r.json();
    const changed=JSON.stringify(d.playlist)!==JSON.stringify(playlist);
    // Rotación desde la config de la pantalla (si la URL no la forzó)
    if(URL_ROTATION===null){
      const rot = (d.config && d.config.rotation!==undefined) ? d.config.rotation : (d.config && d.config.vertical ? 90 : 0);
      applyRotation(rot);
    }
    screenSchedule=d.config?.schedule||null;
    // Se anota ANTES de pisar screenConfig: es la única forma de saber si el
    // usuario acaba de activar o quitar el orden aleatorio.
    const aleatorioAntes=!!(screenConfig&&screenConfig.shuffle);
    screenConfig=d.config||null;
    aplicarTransicion(screenConfig);
    lastContact=Date.now();
    updateScreenStatus();
    if(changed){playlist=d.playlist;rebuildSlides();}
    refrescarOrden(changed, !!(screenConfig&&screenConfig.shuffle)!==aleatorioAntes);
    if(changed&&playlist.length) showSlide(orden[0]||0);
    saveCache();
    // Descargar al televisor lo que aún no tenga. Va sin await a propósito: la
    // pantalla ya está pintando desde la red y esto es trabajo de fondo.
    sincronizarMedios();
  }catch(e){
    // Servidor caído. Lo que ya está en pantalla se queda; solo si arrancamos
    // sin nada que mostrar se tira de lo guardado en el dispositivo.
    if(!playlist.length) restoreFromCache();
  }
  updateOfflineDot();
}

// Punto tenue en una esquina tras un corte prolongado. No molesta al cliente,
// pero permite ver de un vistazo que esa pantalla lleva rato sin actualizarse.
function updateOfflineDot(){
  const hay=isOffline(lastContact, Date.now());
  let d=document.getElementById("offline-dot");
  if(!hay){ if(d) d.remove(); return; }
  if(!d){
    d=document.createElement("div");
    d.id="offline-dot";
    d.title="Sin contacto con el servidor";
    document.getElementById("player").appendChild(d);
  }
}

let reloadTimer=null;
function connectSSE(){
  const es=new EventSource(`/api/events?screen=${encodeURIComponent(SCREEN_ID)}`);
  es.onmessage=(e)=>{
    if(!e.data) return;
    // La pantalla fue eliminada desde el admin -> desconectar y volver a emparejar
    // «deleted» = la pantalla ya no existe. «unlink» = existe pero este
    // dispositivo se suelta de ella para poder reenlazarlo. Para el televisor
    // la reacción es la misma: olvidar quién era y volver a pedir código.
    if(e.data.indexOf("deleted")===0 || e.data.indexOf("unlink")===0){
      es.close();
      // El destino se calcula ANTES de olvidar: si no, el nombre ya no está
      // para mandarlo como pista y el panel no podría sugerir el reenlace.
      // Y el ?nuevo=1 es imprescindible: sin él, /pair podría leer una
      // identidad a medio borrar y devolver el televisor al player.
      const destino="/pair?nuevo=1&era="+encodeURIComponent(SCREEN_ID||"");
      olvidarIdentidad();
      location.href=destino;
      return;
    }
    // Contenido nuevo: se recarga la PLAYLIST, nunca la página. Recargar la
    // página la hacía depender de que el servidor estuviese vivo en ese preciso
    // instante; si no lo estaba, la pantalla moría y no volvía sola.
    // loadPlaylist() ya actualiza rotación, horario, configuración y slides.
    if(e.data.indexOf("update")===0){
      clearTimeout(reloadTimer);
      reloadTimer=setTimeout(loadPlaylist, 500);   // agrupa ráfagas de cambios
    }
  };
  // Se cierra la conexión vieja antes de programar una nueva. Sin esto, cada
  // corte de WiFi (mucho más frecuente en un televisor que en un PC) dejaba
  // la conexión anterior abierta reintentando sola por su cuenta además de la
  // nueva: con las horas se acumulaban conexiones SSE zombis hasta que el
  // navegador del TV, con poca memoria, se quedaba sin recursos y se cerraba.
  es.onerror=()=>{ es.close(); setTimeout(connectSSE,4000); };
}

// Banderas como imágenes (flagcdn) — Windows no renderiza emojis de banderas.
// Acepta código de país ISO ("ve","us") o un emoji de bandera (datos antiguos).
function flagCode(flag){
  if(!flag) return "";
  flag=String(flag).trim();
  if(/^[A-Za-z]{2}$/.test(flag)) return flag.toLowerCase();
  const cp=[...flag].map(c=>c.codePointAt(0));
  if(cp.length>=2 && cp[0]>=0x1F1E6 && cp[0]<=0x1F1FF && cp[1]>=0x1F1E6 && cp[1]<=0x1F1FF)
    return String.fromCharCode(cp[0]-0x1F1E6+65, cp[1]-0x1F1E6+65).toLowerCase();
  return "";
}
function flagImg(flag, w){
  w=w||"100%";
  const code=flagCode(flag);
  if(!code) return `<span>${flag||"🏳"}</span>`;
  // Local primero (offline) → flagcdn (online) → texto
  return `<img src="/vendor/flags/${code}.svg" alt="${code.toUpperCase()}" style="width:${w};aspect-ratio:3/2;object-fit:cover;border-radius:4px;display:inline-block;vertical-align:middle" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://flagcdn.com/${code}.svg'}else{this.outerHTML='<span>'+this.alt+'</span>'}">`;
}

  timerDiv.dataset.endMsg=item.end_message||"¡Oferta finalizada!";
  timerDiv.dataset.startMsg=item.start_message||"Tiempo restante:";
  div.innerHTML=`<div style="opacity:.8;font-size:clamp(18px,2.5vw,36px);margin-bottom:3vh">${item.start_message||"Tiempo restante:"}</div><div class="countdown-timer" id="countdown-${Date.now()}">—</div>`;
  const updateTimer=()=>{
    const now=Date.now();const end=parseInt(timerDiv.dataset.endTime);const diff=Math.max(0,end-now);
    if(diff<=0){div.innerHTML=`<div style="font-size:clamp(24px,4vw,48px)">${timerDiv.dataset.endMsg}</div>`;return;}
    const d=Math.floor(diff/86400000);const h=Math.floor((diff%86400000)/3600000);const m=Math.floor((diff%3600000)/60000);const s=Math.floor((diff%60000)/1000);
    const timer=div.querySelector(".countdown-timer");if(timer){timer.innerHTML=`${d}:<span style="font-size:clamp(48px,11vw,144px)">${String(h).padStart(2,"0")}</span>:<span style="font-size:clamp(48px,11vw,144px)">${String(m).padStart(2,"0")}</span>:<span style="font-size:clamp(48px,11vw,144px)">${String(s).padStart(2,"0")}</span>`;}
    setTimeout(updateTimer,1000);
  };
  setTimeout(updateTimer,100);
  return div;
}

function rebuildSlides(){
  const player=document.getElementById("player");
  player.querySelectorAll(".slide").forEach(s=>s.remove());
  const waiting=document.getElementById("waiting");
  if(!playlist.length){waiting.style.display="flex";return;}
  waiting.style.display="none";
  playlist.forEach((item,i)=>{
    const slide=document.createElement("div");
    slide.className="slide";
    if(item.wall_mode&&item.wall_pos) slide.classList.add("wall-"+item.wall_pos);
    slide.dataset.i=i; slide.dataset.dur=item.duration||8;

    if(item.type==="video"){
      const v=document.createElement("video");
      // El src NO se pone aquí: lo pone materializarVentana() cuando esta
      // diapositiva se acerca. Con preload="auto" en todas, cincuenta vídeos
      // se ponían a bufferear a la vez y la caja se quedaba sin memoria.
      v.dataset.medio=item.src;v.muted=true;v.playsInline=true;v.preload="none";
      slide.appendChild(v);
    } else if(item.type==="url"){
      const fr=document.createElement("iframe");
      fr.src=item.src;fr.sandbox="allow-scripts allow-same-origin";
      slide.appendChild(fr);
    } else if(item.type==="text"){
      const d=document.createElement("div");
      d.className="text-slide";d.style.background=item.bg||"#0a0a0a";
      d.innerHTML=`<div><h2 style="color:${item.color||'#fff'}">${item.title||""}</h2><p style="color:${item.color||'#fff'}">${item.subtitle||""}</p></div>`;
      slide.appendChild(d);
    } else if(item.type==="fx"){
      slide.appendChild(buildFxSlide(item));
    } else if(item.type==="weather"){
      slide.appendChild(buildWeatherSlide(item));
      // Si es live, programar actualización cada 15 min
      if(item.live && item.lat && item.lon) {
        slide.dataset.live = "weather";
        slide.dataset.lat = item.lat;
        slide.dataset.lon = item.lon;
        slide.dataset.unit = item.unit || "C";
        slide.dataset.itemid = item.id;
      }
    } else if(item.type==="ticker"){
      slide.appendChild(buildTickerSlide(item));
    } else if(item.type==="qr"){
      slide.appendChild(buildQrSlide(item));
    } else if(item.type==="product"){
      slide.appendChild(buildProductSlide(item));
    } else if(item.type==="comparison"){
      slide.appendChild(buildComparisonSlide(item));
    } else if(item.type==="countdown"){
      slide.appendChild(buildCountdownSlide(item));
    } else {
      const img=document.createElement("img");
      // Igual que el vídeo: la imagen se carga solo si está cerca de tocarle.
      // Una diapositiva en opacity:0 se sigue pintando, así que un src puesto
      // aquí obliga al navegador a decodificarla aunque no se vea nunca.
      img.dataset.medio=item.src;
      slide.appendChild(img);
    }
    player.appendChild(slide);
  });
  materializarVentana();
}

// ── Materializar la ventana ────────────────────────────────────────────────
// Pone y quita el medio de cada diapositiva según la ventana de reproducción.
// Es la mitad sucia de ventanaSlides(): la decisión está ahí y probada; aquí
// solo se toca el DOM.
var RADIO_VENTANA=2;   // la anterior, la actual y las dos siguientes
function materializarVentana(){
  const slides=document.querySelectorAll(".slide");
  if(!slides.length) return;
  const secuencia=orden.length?orden:playlist.map((_,i)=>i);
  const dentro={};
  ventanaSlides(secuencia, posOrden, RADIO_VENTANA).forEach(i=>{ dentro[i]=1; });
  slides.forEach(slide=>{
    const m=slide.querySelector("img[data-medio],video[data-medio]");
    if(!m) return;
    const i=parseInt(slide.dataset.i,10);
    if(dentro[i]){
      // La URL se resuelve AHORA y no al construir: si mientras tanto ha
      // llegado la copia local, se usa esa sin rehacer todas las diapositivas.
      const url=urlDeMedio(m.dataset.medio,mediosLocales);
      if(m.getAttribute("src")!==url){
        m.setAttribute("src",url);
        if(m.tagName==="VIDEO"){ m.preload="auto"; }   // que se adelante, ya le toca
      }
    } else if(m.hasAttribute("src")){
      m.removeAttribute("src");
      if(m.tagName==="VIDEO"){ m.preload="none"; try{ m.load(); }catch(e){} }  // soltar el búfer
    }
  });
}
// ── fin de materializar ────────────────────────────────────────────────────

function startProgress(ms){
  // La barra está dentro de #player y rota con él, así que siempre anima en anchura
  const bar=document.getElementById("pbar");
  bar.style.transition="none";bar.style.width="0%";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bar.style.transition=`width ${ms}ms linear`;bar.style.width="100%";
  }));
}

let limpiezaSalida=null;

function showSlide(idx){
  const slides=document.querySelectorAll(".slide");
  if(!slides.length)return;
  current=((idx%slides.length)+slides.length)%slides.length;
  const slide=slides[current];
  const saliente=document.querySelector(".slide.active");
  const trMs=duracionTransicion(screenConfig);

  // Las que ni entran ni salen se apagan en seco: no se ven de todos modos.
  slides.forEach(s=>{
    if(s===saliente||s===slide) return;
    s.classList.remove("active","leaving");
    const v=s.querySelector("video");
    if(v){v.pause();v.currentTime=0;}
  });

  // Con una sola diapositiva no hay transición que hacer, y montarla dejaría
  // la pantalla parpadeando cada vez que se reinicia el ciclo.
  if(saliente&&saliente!==slide){
    clearTimeout(limpiezaSalida);
    saliente.classList.remove("active");
    saliente.classList.add("leaving");
    limpiezaSalida=setTimeout(()=>{
      // El vídeo que sale se corta al TERMINAR la transición, no al empezar.
      // Antes se pausaba y rebobinaba de golpe y se quedaba congelado a medio
      // fundido, a la vista.
      const v=saliente.querySelector("video");
      if(v){v.pause();v.currentTime=0;}
      // Quitar .leaving devuelve la diapositiva a su posición de espera. Sin
      // cortar la transición antes, ese salto se animaría: se vería volver
      // cruzando la pantalla, ya invisible pero moviéndose. El reflow es
      // obligatorio; sin él el navegador agrupa los tres cambios y no sirve.
      saliente.classList.add("sin-transicion");
      saliente.classList.remove("leaving");
      void saliente.offsetWidth;
      saliente.classList.remove("sin-transicion");
    }, trMs);
  }
  slide.classList.remove("leaving");
  slide.classList.add("active");
  // Antes de arrancar nada: cargar lo que viene y soltar lo que ya no hace
  // falta. Va aquí y no en next() porque showSlide también se llama desde el
  // refresco, desde la caché y al cambiar el tamaño de la pantalla.
  materializarVentana();
  const isVideo=!!slide.querySelector("video");
  const fx=slide.querySelector(".mod-fx");
  const ms=(parseFloat(slide.dataset.dur)||8)*1000;
  clearTimeout(timer);
  if(isVideo){
    const v=slide.querySelector("video");
    v.currentTime=0; v.play().catch(()=>{});
    // El vídeo MANDA: avanzamos cuando TERMINA, no por un tiempo fijo
    v.addEventListener("ended",()=>next(),{once:true});
    v.addEventListener("error",()=>next(),{once:true});  // si el vídeo falla, no bloquear la rotación
    // La barra de progreso sigue la duración real del vídeo
    const startBar=()=>startProgress((isFinite(v.duration)&&v.duration>0)?v.duration*1000:ms);
    if(isFinite(v.duration)&&v.duration>0) startBar();
    else v.addEventListener("loadedmetadata",startBar,{once:true});
  } else if(fx){
    // Divisas: si no caben todas las filas, las reparte en páginas que rotan
    setupFxPagination(slide, ms, ()=>next());
  } else {
    startProgress(ms);
    timer=setTimeout(()=>next(),ms);
  }
}

// Cuántas divisas caben por página. Es una regla de LEGIBILIDAD, no una medida.
//
// Antes se deducía midiendo el DOM con los tamaños máximos de tipografía. Esos
// topes existen para que el texto no desborde a lo ancho, pero usarlos como
// altura típica es absurdo: en una pantalla horizontal la caja mide ~1766 px, la
// cotización se medía a 203 px y salían filas de 300 px de alto. Con 700 px
// útiles solo caben dos, y 9 divisas acababan en 5 páginas de 2.
//
// Ahora: nunca más de 8 por página —por encima de eso no se leen de lejos— y
// nunca filas de menos de 56 px, que es el suelo en pantallas pequeñas.
const MAX_FILAS_POR_PAGINA = 8;
function capacidadPagina(avail){
  const alto = Math.max(56, avail / MAX_FILAS_POR_PAGINA);
  return Math.max(1, Math.min(MAX_FILAS_POR_PAGINA, Math.floor(avail / alto) || 1));
}

// Agrupa filas en páginas según la altura disponible. Pura a propósito: recibe
// las alturas ya medidas, para poder probarla sin DOM (tests/fx-pagination.test.js).
//
// Reparte EQUILIBRADO, no llenando hasta arriba. Llenar la primera página al
// máximo dejaba huérfana la última: con 8 divisas salía 7 y 1, y esa fila suelta
// se estiraba a pantalla completa. Primero se calcula cuántas páginas hacen
// falta y luego se reparten las filas a partes iguales.
//
// Una fila más alta que `avail` se coloca igualmente en su propia página: el
// guardo `cabe>0` evita el bucle infinito y las páginas vacías.
function groupRowsIntoPages(heights, avail){
  const n=heights.length;
  if(!n) return [];

  // Cuántas caben en una página, midiendo desde la más alta hacia abajo para
  // que el reparto valga aunque las filas no midan todas lo mismo.
  let cabe=0, usado=0;
  for(const h of heights){
    if(cabe>0 && usado+h>avail) break;
    cabe++; usado+=h;
  }
  if(cabe<=0) cabe=1;
  if(cabe>=n) return [heights.map((_,i)=>i)];       // caben todas: una página

  const paginas=Math.ceil(n/cabe);
  const base=Math.floor(n/paginas), resto=n%paginas;  // las primeras llevan una más
  const out=[]; let i=0;
  for(let p=0;p<paginas;p++){
    const cuantas=base+(p<resto?1:0);
    out.push(Array.from({length:cuantas},(_,k)=>i+k));
    i+=cuantas;
  }
  return out;
}

// En modo previa, devolver al admin cuántas páginas han salido. Es la respuesta
// a "¿cuántas divisas caben?", medida por el renderizador real en vez de estimada.
function reportPreviewPages(pages, rowsFirstPage){
  if(!PREVIEW) return;
  parent.postMessage({type:"preview-pages",pages,rowsFirstPage},"*");
}

// Pagina el módulo de divisas según lo que cabe en pantalla. Muestra una página
// cada perPageMs y llama onDone() cuando ha mostrado todas (entonces avanza el slide).
function setupFxPagination(slide, perPageMs, onDone){
  const container=slide.querySelector(".mod-fx-rows");
  const indicator=slide.querySelector(".mod-fx-page");
  const rows=container?Array.from(container.querySelectorAll(".fx-row")):[];
  rows.forEach(r=>r.style.display="");
  let avail=0;
  if(container){
    const cs=getComputedStyle(container);
    avail=container.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
  }
  // Reparte el alto entre las filas visibles y publica el ancho REAL de la caja,
  // del que cuelgan los topes de tipografía. Se mide aquí y no se usa vw porque
  // con el player rotado por CSS vw se refiere al viewport sin rotar.
  //
  // El alto de fila se limita a un cuarto de la caja: con una sola divisa en la
  // página, repartir "todo el alto entre una" daba una fila de pantalla completa
  // con el texto gigante. Por debajo de cuatro filas se centran en vez de estirarse.
  const MIN_FILAS_VISUALES=4;
  const fitRows=(n)=>{
    if(!container) return;
    const filas=Math.max(1,n);
    const alto=Math.min(avail/filas, avail/MIN_FILAS_VISUALES);
    container.style.setProperty("--fx-row-h", alto+"px");
    container.style.setProperty("--fx-box-w", container.clientWidth+"px");
    // Si no llenan, agrupar en el centro; si llenan, repartir todo el alto.
    container.style.justifyContent = (filas<MIN_FILAS_VISUALES) ? "center" : "stretch";
    container.style.setProperty("--fx-flex", filas<MIN_FILAS_VISUALES ? "0 0 auto" : "1 1 0");
  };

  if(rows.length<=1 || avail<=0){                      // nada que paginar
    if(indicator) indicator.style.display="none";
    fitRows(rows.length);
    reportPreviewPages(1, rows.length);
    startProgress(perPageMs); timer=setTimeout(onDone, perPageMs); return;
  }
  // La capacidad sale de una regla de legibilidad, no de medir el DOM. Se pasan
  // alturas uniformes para que groupRowsIntoPages calcule el reparto equilibrado.
  const altoFila=avail/capacidadPagina(avail);
  const pages=groupRowsIntoPages(rows.map(()=>altoFila), avail).map(idxs=>idxs.map(i=>rows[i]));

  if(pages.length<=1){                                 // caben todas: comportamiento normal
    if(indicator) indicator.style.display="none";
    fitRows(rows.length);
    reportPreviewPages(1, rows.length);
    startProgress(perPageMs); timer=setTimeout(onDone, perPageMs); return;
  }
  // Varias páginas: rotar entre ellas, y avanzar el slide al terminar la última
  reportPreviewPages(pages.length, pages[0].length);
  let pi=0;
  const show=()=>{
    rows.forEach(r=>r.style.display="none");
    pages[pi].forEach(r=>r.style.display="");
    fitRows(pages[pi].length);                         // cada página llena la pantalla
    if(indicator){ indicator.style.display=""; indicator.textContent=`${pi+1} / ${pages.length}`; }
    startProgress(perPageMs);
    timer=setTimeout(()=>{ pi++; (pi<pages.length)?show():onDone(); }, perPageMs);
  };
  show();
}

// ── Ventana de diapositivas ────────────────────────────────────────────────
// Qué diapositivas se mantienen cargadas de verdad (con su imagen o su vídeo)
// y cuáles se dejan vacías.
//
// El reproductor monta TODAS las diapositivas en el DOM de una vez. Con cuatro
// contenidos da igual; con cincuenta no: las que no se ven están en opacity:0,
// y una capa transparente SE SIGUE PINTANDO, así que el navegador decodifica
// las cincuenta imágenes. Un 1080p descomprimido son unos 8 MB; en una caja
// Android de 1-2 GB el sistema acaba matando la aplicación y la pantalla se
// queda negra. No es lentitud: es que se muere.
//
// Se devuelve la actual, la anterior —que aún se está yendo, y descargarla a
// media transición se ve— y las siguientes, que así llegan ya decodificadas y
// no hay parpadeo negro al cambiar.
//
// Sobre el ORDEN de reproducción, no sobre los índices de la playlist: con el
// orden aleatorio la siguiente no es la de al lado.
function ventanaSlides(orden, pos, radio){
  var total = orden.length;
  if(!total) return [];
  var r = Math.min(radio, Math.floor(total/2));   // sin dar vueltas de más
  var p = ((pos % total) + total) % total;        // una posición fuera de rango no puede dejar la pantalla en negro
  var vistos = {}, salida = [];
  for(var d = -r; d <= r; d++){
    var i = orden[((p + d) % total + total) % total];
    if(!vistos[i]){ vistos[i] = 1; salida.push(i); }
  }
  return salida.sort(function(a,b){ return a-b; });
}
// ── fin de la ventana ──────────────────────────────────────────────────────

// ── Ciclo de reproduccion ──────────────────────────────────────────────────
// El ciclo va por una lista de indices, no por current+1. Asi el orden puede
// ser el del usuario o uno barajado sin que showSlide se entere de nada.
var orden=[], posOrden=0;

function rehacerOrden(){
  const aleatorio=!!(screenConfig&&screenConfig.shuffle);
  const ultimo=orden.length?orden[orden.length-1]:-1;
  orden=ordenReproduccion(playlist.length, aleatorio, ultimo);
  posOrden=0;
}

// Por aquí pasa el refresco periódico, cada 15 segundos.
//
// Rehacer el orden devuelve el puntero al principio, así que hacerlo en cada
// refresco -como se hacía- dejaba la pantalla ATASCADA: con pases de 10 s, el
// puntero volvía a cero cada 15 y el siguiente avance saltaba otra vez al
// segundo contenido, una y otra vez. Los demás no aparecían nunca. Se vio en
// una tienda con dos imágenes y dos tableros de divisas: solo salía uno.
//
// Se rehace solo cuando de verdad cambió algo. El caso que obligaba a mirar
// siempre -que el usuario active el orden aleatorio sin tocar el contenido- se
// resuelve comparando el ajuste, no reconstruyendo a ciegas.
function refrescarOrden(cambioPlaylist, cambioAleatorio){
  if(cambioPlaylist || cambioAleatorio || !orden.length) rehacerOrden();
}

function next(){
  clearTimeout(timer);
  if(!playlist.length) return;
  posOrden++;
  // Al acabar la vuelta se rehace: con orden fijo sale la misma lista, y con
  // aleatorio una baraja nueva que no empieza por donde acabo la anterior.
  if(posOrden>=orden.length) rehacerOrden();
  showSlide(orden.length?orden[posOrden]:0);
}
// ── fin del ciclo ──────────────────────────────────────────────────────────

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft"){clearTimeout(timer);showSlide(current-1);}
  if(e.key==="f"||e.key==="F"){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  }
});
document.body.addEventListener("click",()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
});

if(PREVIEW){
  // El admin inyecta el módulo que está editando; así se ve antes de guardar.
  window.addEventListener("message",(e)=>{
    const m=e.data||{};
    if(m.type!=="preview-item"||!m.item) return;
    applyRotation(m.rotation||0);
    playlist=[m.item]; rebuildSlides(); showSlide(0);
  });
  parent.postMessage({type:"preview-ready"},"*");
} else if(SCREEN_ID){
  // Pintar YA lo último reproducido. Si el servidor está caído al encender la
  // pantalla, esto es la diferencia entre mostrar contenido o quedarse en negro.
  restoreFromCache();
  connectSSE(); loadPlaylist();

  // Recarga de seguridad. El navegador de algunas Smart TV -el de LG webOS es
  // un caso documentado por el propio soporte de LG- cierra la página entera
  // cuando la memoria acumulada por llevar horas abierta supera lo que el TV
  // puede procesar. No es un fallo de esta página: es un límite del navegador
  // del televisor, y el cierre que hace el sistema operativo es más brusco que
  // una recarga controlada -a veces ni siquiera vuelve a abrirse solo-.
  // Es seguro adelantarse con una recarga propia: restoreFromCache() dejó
  // pintado algo desde el primer instante, así que si el servidor estuviera
  // caído justo cuando toca recargar, la pantalla no se queda en negro.
  const RELOAD_SEGURIDAD_MS=4*60*60*1000;   // 4 horas
  setTimeout(()=>location.reload(), RELOAD_SEGURIDAD_MS);
}
setInterval(()=>{ if(SCREEN_ID && !PREVIEW) loadPlaylist(); },15000);

// Re-paginar/re-adaptar el slide actual si cambia el tamaño o la orientación de la pantalla
let resizeTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ if(playlist.length) showSlide(current); }, 400);
});

// Actualizar clima en vivo cada 15 min
const WMO_P={0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌧",61:"🌧",63:"🌧",65:"🌧",71:"🌨",73:"❄️",75:"❄️",80:"🌦",81:"🌧",82:"⛈",95:"⛈",96:"⛈",99:"⛈"};
const WMO_D={0:"Cielo despejado",1:"Mayormente despejado",2:"Parcialmente nublado",3:"Nublado",45:"Niebla",51:"Llovizna",61:"Lluvia ligera",63:"Lluvia moderada",65:"Lluvia intensa",71:"Nevada",80:"Chubascos",81:"Chubascos moderados",82:"Chubascos intensos",95:"Tormenta"};

async function refreshLiveWeather(){
  const slides=document.querySelectorAll(".slide[data-live='weather']");
  for(const slide of slides){
    const lat=slide.dataset.lat, lon=slide.dataset.lon, unit=slide.dataset.unit;
    if(!lat||!lon) continue;
    try{
      const tu=unit==="F"?"fahrenheit":"celsius";
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&temperature_unit=${tu}&wind_speed_unit=kmh&timezone=auto`);
      const d=await r.json();
      const c=d.current;
      const icon=WMO_P[c.weather_code]||"🌡";
      const desc=WMO_D[c.weather_code]||"";
      const wmod=slide.querySelector(".mod-weather");
      if(!wmod) continue;
      const ti=wmod.querySelector(".weather-icon"); if(ti) ti.textContent=icon;
      const tt=wmod.querySelector(".weather-temp"); if(tt) tt.firstChild.textContent=`${Math.round(c.temperature_2m)}°`;
      const td=wmod.querySelector(".weather-desc"); if(td) td.textContent=desc;
      const spans=wmod.querySelectorAll(".weather-details span");
      if(spans[0]) spans[0].textContent=`💧${Math.round(c.relative_humidity_2m)}%`;
      if(spans[1]) spans[1].textContent=`💨${Math.round(c.wind_speed_10m)} km/h`;
      if(spans[2]) spans[2].textContent=`🌡 Sensación ${Math.round(c.apparent_temperature)}°`;
    }catch(e){}
  }
}
setInterval(refreshLiveWeather, 15*60*1000);
setTimeout(refreshLiveWeather, 3000);
setInterval(updateScreenStatus, 60*1000);
setTimeout(updateScreenStatus, 500);
</script>
