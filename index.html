<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SignalOS Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;background:#07182b;color:#eaf1f9;font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.box{text-align:center}
.logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:4px;color:#FF7F00;font-weight:600;margin-bottom:22px}
.msg{font-size:14px;color:#7a8ca3;letter-spacing:1px}
.spinner{width:30px;height:30px;border:3px solid #1d3a5c;border-top-color:#FF7F00;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.admin-link{position:fixed;bottom:16px;right:18px;font-size:11px;color:#3a5170;text-decoration:none;font-family:'Space Mono',monospace;letter-spacing:1px}
.admin-link:hover{color:#FF7F00}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="logo">SIGNAL/OS PRO</div>
  <div class="msg" id="msg">Iniciando pantalla…</div>
</div>
<a class="admin-link" href="/admin.html">⚙ Administración</a>

<script>
// Router de arranque: cada dispositivo recuerda su propia identidad de pantalla.
// - Si ya está enlazada (localStorage) → va directo a reproducir.
// - Si no → va a la pantalla de emparejamiento (pide el código PIN).
(function(){
  var sid = null;
  try { sid = localStorage.getItem("signalos_screen_id"); } catch(e){}
  if (sid) {
    location.replace("/player.html?screen=" + encodeURIComponent(sid));
  } else {
    document.getElementById("msg").textContent = "Pantalla sin enlazar — pidiendo código…";
    setTimeout(function(){ location.replace("/pair"); }, 1500);
  }
})();
</script>
</body>
</html>
