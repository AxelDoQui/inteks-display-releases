<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enlazar pantalla — InTeks Display</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;background:#07182b;color:#eaf1f9;
  font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;
  justify-content:center;padding:4vmin;overflow:hidden;cursor:none}
.container{text-align:center;max-width:92vw}
.logo{font-family:'Space Mono',ui-monospace,monospace;font-size:clamp(11px,1.6vmin,16px);
  letter-spacing:4px;color:#FF7F00;margin-bottom:5vmin;font-weight:600}
h1{font-size:clamp(18px,3.4vmin,34px);font-weight:500;margin-bottom:1.5vmin;letter-spacing:2px}
.subtitle{font-size:clamp(13px,2.1vmin,20px);color:#7a8ca3;margin-bottom:6vmin;line-height:1.6}

/* El código es lo único que hay que leer desde lejos, a veces desde la otra
   punta del local, así que manda sobre todo lo demás. */
.code{font-family:'Space Mono',ui-monospace,monospace;font-weight:700;
  font-size:clamp(64px,22vmin,240px);letter-spacing:clamp(8px,2.5vmin,28px);
  color:#FF7F00;line-height:1;margin:0 0 5vmin;
  text-shadow:0 0 clamp(20px,4vmin,60px) rgba(255,127,0,.25)}
.code.cargando{color:#1d3a5c;text-shadow:none}

.hint{font-size:clamp(12px,1.9vmin,18px);color:#7a8ca3;line-height:1.7}
.hint strong{color:#eaf1f9;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF7F00;
  margin-right:8px;animation:latido 1.4s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:.25}50%{opacity:1}}

.error{margin-top:4vmin;font-size:clamp(12px,1.9vmin,18px);color:#f05050;display:none}
.pie{position:fixed;bottom:3vmin;left:0;right:0;text-align:center;
  font-size:clamp(10px,1.5vmin,14px);color:#3a5170;font-family:'Space Mono',ui-monospace,monospace;
  letter-spacing:1px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">INTEKS DISPLAY</div>
  <h1>Enlazar pantalla</h1>
  <div class="subtitle">Escribe este código en el panel de administración</div>

  <div class="code cargando" id="code">····</div>

  <div class="hint">
    <span class="dot"></span>Esperando a que le pongas nombre desde el ordenador<br>
    Panel de administración → <strong>Pantallas</strong> → <strong>Esperando para enlazar</strong>
  </div>

  <div class="error" id="error"></div>
</div>
<div class="pie" id="pie"></div>

<script>
// Emparejamiento inverso: es la PANTALLA la que pide un código y lo muestra, y
// el nombre se le pone desde el ordenador. Antes era al revés —el admin
// generaba un PIN y había que teclearlo aquí con el mando del televisor—, que
// es justo lo incómodo. Leer un número en la pantalla y escribirlo con un
// teclado de verdad es mucho más fácil.
const elCode = document.getElementById("code");
const elError = document.getElementById("error");
let token = null, sondeo = null;

function fallo(msg){
  elError.textContent = msg;
  elError.style.display = "block";
}

async function pedirCodigo(){
  elError.style.display = "none";
  elCode.classList.add("cargando");
  elCode.textContent = "····";
  try{
    const r = await fetch("/api/pair-request", {method:"POST"});
    const d = await r.json();
    if(!d.ok || !d.code) throw new Error("respuesta inesperada");
    token = d.token;
    elCode.textContent = d.code;
    elCode.classList.remove("cargando");
    arrancarSondeo();
  }catch(e){
    // Sin servidor no hay código posible. Se reintenta solo: la pantalla puede
    // encenderse antes que el PC, y nadie va a estar delante para recargar.
    fallo("Sin conexión con el servidor. Reintentando…");
    setTimeout(pedirCodigo, 5000);
  }
}

function arrancarSondeo(){
  clearInterval(sondeo);
  sondeo = setInterval(comprobar, 2000);
}

async function comprobar(){
  if(!token) return;
  try{
    const r = await fetch("/api/pair-status", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({token})
    });
    const d = await r.json();
    if(d.expired){                       // el servidor se reinició y olvidó el token
      clearInterval(sondeo); token = null;
      pedirCodigo();
      return;
    }
    if(d.claimed && d.screen){
      clearInterval(sondeo);
      try{ localStorage.setItem("signalos_screen_id", d.screen); }catch(e){}
      elCode.textContent = "✓";
      document.querySelector(".subtitle").textContent = "Enlazada como «" + d.screen + "»";
      document.querySelector(".hint").innerHTML = "Iniciando…";
      setTimeout(()=>{ location.replace("/player.html?screen=" + encodeURIComponent(d.screen)); }, 1200);
    }
  }catch(e){ /* corte pasajero: el siguiente sondeo lo resuelve */ }
}

// Pie con la dirección, útil para saber a qué servidor está mirando la pantalla
document.getElementById("pie").textContent = location.host;

pedirCodigo();
</script>
</body>
</html>
