<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enlazar pantalla — SignalOS Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;background:#07182b;color:#eaf1f9;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:500px;text-align:center}
.logo{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;color:#FF7F00;margin-bottom:30px;font-weight:600}
h1{font-size:24px;font-weight:500;margin-bottom:10px;letter-spacing:2px}
.subtitle{font-size:14px;color:#7a8ca3;margin-bottom:40px;line-height:1.6}

.otp-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:40px;flex-wrap:wrap}
.otp-input{width:50px;height:50px;font-size:24px;font-weight:700;text-align:center;border:2px solid #1d3a5c;background:#0A2540;color:#FF7F00;border-radius:8px;font-family:monospace;cursor:text}
.otp-input:focus{outline:none;border-color:#FF7F00;box-shadow:0 0 10px rgba(255,127,0,.2)}

.form-group{margin-bottom:24px}
.label{display:block;font-size:12px;color:#7a8ca3;margin-bottom:8px;text-align:left;letter-spacing:1px;text-transform:uppercase;font-family:'Space Mono',monospace}
.text-input{width:100%;padding:14px;font-size:16px;border:1px solid #1d3a5c;background:#0A2540;color:#eaf1f9;border-radius:8px;font-family:'DM Sans',sans-serif}
.text-input:focus{outline:none;border-color:#FF7F00}
.text-input::placeholder{color:#7a8ca3}

.buttons{display:flex;gap:10px}
.btn{flex:1;padding:14px;font-size:14px;font-weight:500;border:none;border-radius:8px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-primary{background:#FF7F00;color:#111;border:none}
.btn-primary:hover{background:#e67200}
.btn-primary:disabled{background:#7a8ca3;cursor:not-allowed;color:rgba(17,17,17,.5)}
.btn-secondary{background:transparent;border:1px solid #1d3a5c;color:#eaf1f9}
.btn-secondary:hover{border-color:#FF7F00;color:#FF7F00}

.status{margin-top:20px;padding:12px;border-radius:8px;font-size:13px;display:none}
.status.loading{background:rgba(255,127,0,.1);border:1px solid rgba(255,127,0,.3);color:#FF7F00;display:block}
.status.error{background:rgba(240,80,80,.1);border:1px solid rgba(240,80,80,.3);color:#f05050;display:block}
.status.success{background:rgba(64,192,128,.1);border:1px solid rgba(64,192,128,.3);color:#40c080;display:block}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid transparent;border-top-color:#FF7F00;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.hint{font-size:11px;color:#7a8ca3;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="container">
  <div class="logo">SIGNAL/OS PRO</div>
  <h1>Enlazar pantalla</h1>
  <p class="subtitle">Introduce el código PIN que te proporcione el administrador</p>

  <div class="form-group">
    <label class="label">Código PIN (6 dígitos)</label>
    <div class="otp-inputs" id="otpContainer"></div>
  </div>

  <div class="form-group">
    <label class="label">Nombre de la pantalla</label>
    <input type="text" class="text-input" id="screenName" placeholder="ej: caja-1, videowall-entrada..." maxlength="30">
    <p class="hint">Usa un nombre descriptivo para identificar esta pantalla</p>
  </div>

  <div class="buttons">
    <button class="btn btn-secondary" onclick="resetForm()">Limpiar</button>
    <button class="btn btn-primary" id="connectBtn" onclick="connectScreen()">Conectar pantalla</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const OTP_LENGTH = 6;
let otpValues = new Array(OTP_LENGTH).fill("");

function initOTP() {
  const container = document.getElementById("otpContainer");
  container.innerHTML = "";
  for (let i = 0; i < OTP_LENGTH; i++) {
    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = "1";
    input.className = "otp-input";
    input.id = `otp-${i}`;
    input.addEventListener("input", (e) => handleOtpInput(e, i));
    input.addEventListener("keydown", (e) => handleOtpKeydown(e, i));
    input.addEventListener("paste", handleOtpPaste);
    container.appendChild(input);
  }
  document.getElementById("otp-0").focus();
}

function handleOtpInput(e, index) {
  const value = e.target.value;
  if (!/^\d*$/.test(value)) {
    e.target.value = "";
    return;
  }
  otpValues[index] = value;
  if (value && index < OTP_LENGTH - 1) {
    document.getElementById(`otp-${index + 1}`).focus();
  }
}

function handleOtpKeydown(e, index) {
  if (e.key === "Backspace" && !e.target.value && index > 0) {
    document.getElementById(`otp-${index - 1}`).focus();
  } else if (e.key === "ArrowLeft" && index > 0) {
    document.getElementById(`otp-${index - 1}`).focus();
  } else if (e.key === "ArrowRight" && index < OTP_LENGTH - 1) {
    document.getElementById(`otp-${index + 1}`).focus();
  }
}

function handleOtpPaste(e) {
  e.preventDefault();
  const pastedText = (e.clipboardData || window.clipboardData).getData("text");
  const digits = pastedText.replace(/\D/g, "").split("").slice(0, OTP_LENGTH);
  digits.forEach((digit, i) => {
    otpValues[i] = digit;
    document.getElementById(`otp-${i}`).value = digit;
  });
  if (digits.length === OTP_LENGTH) {
    document.getElementById("connectBtn").focus();
  }
}

function resetForm() {
  otpValues = new Array(OTP_LENGTH).fill("");
  document.getElementById("screenName").value = "";
  document.querySelectorAll(".otp-input").forEach(input => input.value = "");
  hideStatus();
  document.getElementById("otp-0").focus();
}

function getOTP() {
  return otpValues.join("");
}

// Si se llegó por el QR (con ?pin=XXXXXX), rellenar el PIN automáticamente
function prefillPinFromURL() {
  const pin = (new URLSearchParams(location.search).get("pin") || "").replace(/\D/g, "").slice(0, OTP_LENGTH);
  if (!pin.length) return;
  pin.split("").forEach((d, i) => {
    otpValues[i] = d;
    const el = document.getElementById(`otp-${i}`);
    if (el) el.value = d;
  });
  const nameEl = document.getElementById("screenName");
  if (nameEl) nameEl.focus();  // solo falta escribir el nombre
}

function showStatus(message, type) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.className = `status ${type}`;
}

function hideStatus() {
  document.getElementById("status").className = "status";
}

async function connectScreen() {
  const pin = getOTP();
  const screenName = document.getElementById("screenName").value.trim();

  if (pin.length !== OTP_LENGTH) {
    showStatus("Por favor, completa el código PIN", "error");
    return;
  }
  if (!screenName) {
    showStatus("Por favor, proporciona un nombre para la pantalla", "error");
    return;
  }

  const btn = document.getElementById("connectBtn");
  btn.disabled = true;
  showStatus("<span class='spinner'></span>Conectando...", "loading");

  try {
    const response = await fetch("/api/pair", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin, screen_name: screenName })
    });

    const data = await response.json();

    if (response.ok && data.ok) {
      // Recordar esta identidad en el dispositivo: así, tras un reinicio, el TV
      // abre la URL pelada y reanuda solo, sin volver a pedir el código.
      try { localStorage.setItem("signalos_screen_id", screenName); } catch (e) {}
      showStatus("✓ ¡Pantalla conectada! Redirigiendo...", "success");
      setTimeout(() => {
        // Redirigir manteniendo el MISMO host por el que entró la tablet (IP o nombre),
        // en vez de la IP que adivine el servidor (más fiable en Android)
        window.location.href = `/player.html?screen=${encodeURIComponent(screenName)}`;
      }, 1500);
    } else {
      showStatus(`✗ Error: ${data.error || "No se pudo conectar"}`, "error");
      btn.disabled = false;
    }
  } catch (error) {
    showStatus("✗ Error de conexión. Intenta de nuevo.", "error");
    btn.disabled = false;
  }
}

// Inicializar
initOTP();
prefillPinFromURL();
document.getElementById("screenName").focus = function() {
  setTimeout(() => document.getElementById("screenName").focus(), 100);
};
</script>
</body>
</html>
